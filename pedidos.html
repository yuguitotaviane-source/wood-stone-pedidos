<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wood Stone · Pedidos</title>
<link rel="manifest" href="manifest-pedidos.webmanifest">
<meta name="theme-color" content="#5A1A2B">
<link rel="apple-touch-icon" href="apple-touch-icon-pedidos.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedidos">
<style>
:root{--w:#5A1A2B;--bg:#f6f3ef;--c:#fff;--t:#222;--m:#777;--ok:#1b7a3d;--bad:#c0262d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:#fff;border-bottom:3px solid var(--w);padding:8px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{height:42px}header h1{font-size:17px;margin:0;color:var(--w);flex:1}
header small{color:var(--m);font-size:11px;display:block}
button{font:inherit;border:0;border-radius:8px;padding:9px 12px;background:var(--w);color:#fff;cursor:pointer}
button.l{background:#e8e2da;color:var(--t)}button.d{background:var(--bad)}
#chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px}
#chips button{background:#e8e2da;color:var(--t);white-space:nowrap;padding:6px 11px;font-size:13px}
#chips button.on{background:var(--w);color:#fff}
#list{padding:0 12px 90px;display:grid;gap:10px}
.card{background:var(--c);border-radius:12px;padding:12px;box-shadow:0 1px 3px #0002}
.card h3{margin:0 0 2px;font-size:16px}.card .n{color:var(--w);font-weight:700;font-size:12px}
.card p{margin:3px 0;font-size:13px;color:#444}.st{display:inline-block;background:#f0e4e8;color:var(--w);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.late{color:var(--bad);font-weight:700}.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1}
#add{position:fixed;right:14px;bottom:44px;border-radius:30px;padding:14px 20px;box-shadow:0 3px 8px #0004}
footer{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:11px;color:var(--m);padding:6px;background:#fffd}
#login{max-width:340px;margin:50px auto;padding:20px;background:#fff;border-radius:12px;text-align:center}
#login img{height:90px}input,select,textarea{width:100%;font:inherit;padding:9px;border:1px solid #ccc;border-radius:8px;margin:3px 0 9px}
label{font-size:12px;color:var(--m)}dialog{width:min(480px,94vw);border:0;border-radius:14px;padding:16px}
dialog::backdrop{background:#0007}.err{color:var(--bad);font-size:13px}.hide{display:none!important}
</style>
</head>
<body>
<p id="boot" style="text-align:center;padding:40px 16px;color:#5A1A2B;font-size:16px">Carregando…</p>
<script>
const bt0=()=>document.getElementById("boot");
if(location.protocol==="file:")bt0().innerHTML="Abra pelo endereço do site (https://…), não pelo arquivo baixado: o login não funciona assim.";
addEventListener("error",e=>{if(bt0())bt0().innerHTML="Erro ao carregar: "+e.message});
setTimeout(()=>{if(bt0())bt0().innerHTML="Não carregou. Confira a internet e abra pelo endereço do site, não pelo arquivo baixado."},7000);
</script>

  <div id="chips"></div><p id="msg" class="err" style="padding:0 12px"></p><div id="list"></div>
  <button id="add">+ Novo pedido</button>
  <footer>Wood Stone · Criado por Estevam Yury · v1.0</footer>
</div>

<dialog id="dlg"><form method="dialog" id="frm" style="margin:0">
  <h3 id="dt" style="margin-top:0;color:var(--w)">Novo pedido</h3>
  <label>Cliente</label><input id="f-cli" required>
  <label>Endereço / obra</label><input id="f-obra">
  <label>Material</label><input id="f-mat" placeholder="ex.: Absolute Black leather">
  <label>Pés quadrados (sq ft)</label><input id="f-sq" type="number" step="0.01" inputmode="decimal">
  <label>Prazo de entrega</label><input id="f-pz" type="date">
  <label>Responsável</label><input id="f-resp">
  <label>Instalador</label><input id="f-inst">
  <label>Etapa</label><select id="f-st"></select>
  <label>Observações</label><textarea id="f-obs" rows="3"></textarea>
  <div class="row"><button type="button" class="l" id="cancel">Cancelar</button><button id="save">Salvar</button></div>
  <div class="row"><button type="button" class="d" id="del">Excluir pedido</button></div>
</form></dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,doc,updateDoc,deleteDoc,onSnapshot,query,orderBy,serverTimestamp,arrayUnion} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyCl_NMyhc9yloN738VbAbl40hayOl7eq14",
  authDomain:"wood-stone-gestao.firebaseapp.com",
  projectId:"wood-stone-gestao",
  storageBucket:"wood-stone-gestao.firebasestorage.app",
  messagingSenderId:"453561549876",
  appId:"1:453561549876:web:9ace367d15605d2a31b661"
});
const auth=getAuth(app),db=getFirestore(app);
const STAGES=["Medição","Projeto aprovado","Compra de material","Corte","Acabamento","Controle de qualidade","Entrega e instalação","Pedido fechado"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let user=null,pedidos=[],filtro="Abertos",editId=null,unsub=null;

$("f-st").innerHTML=STAGES.map(s=>`<option>${s}</option>`).join("");

onAuthStateChanged(auth,u=>{
  const bt=$("boot");if(bt)bt.remove();
  user=u;$("login").classList.toggle("hide",!!u);$("app").classList.toggle("hide",!u);
  if(unsub){unsub();unsub=null}
  if(u){$("who").textContent=u.email;
    unsub=onSnapshot(query(collection(db,"pedidos"),orderBy("criadoEm","desc")),
      snap=>{pedidos=snap.docs.map(d=>({id:d.id,...d.data()}));$("msg").textContent="";render()},
      e=>{$("msg").textContent="Sem acesso aos dados (banco não criado ou regras de segurança). "+e.code});
  }
});
$("go").onclick=async()=>{$("lerr").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
  catch(e){$("lerr").textContent="E-mail ou senha incorretos."}};
$("out").onclick=()=>signOut(auth);

function render(){
  const ab=p=>p.status!==STAGES[STAGES.length-1];
  const cnt=s=>s==="Abertos"?pedidos.filter(ab).length:s==="Todos"?pedidos.length:pedidos.filter(p=>p.status===s).length;
  $("chips").innerHTML=["Abertos","Todos",...STAGES].map(s=>`<button class="${s===filtro?"on":""}" data-s="${esc(s)}">${esc(s)} (${cnt(s)})</button>`).join("");
  $("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{filtro=b.dataset.s;render()});
  const lista=pedidos.filter(p=>filtro==="Abertos"?ab(p):filtro==="Todos"?true:p.status===filtro);
  const hoje=new Date().toISOString().slice(0,10);
  $("list").innerHTML=lista.length?lista.map(p=>{
    const i=STAGES.indexOf(p.status),prox=STAGES[i+1],atr=p.prazo&&p.prazo<hoje&&ab(p);
    return `<div class="card"><span class="n">${esc(p.numero)}</span> <span class="st">${esc(p.status)}</span>
      <h3>${esc(p.cliente)}</h3>
      <p>${esc(p.obra)}</p><p>${esc(p.material)}${p.sqft?" · "+esc(p.sqft)+" sq ft":""}</p>
      <p class="${atr?"late":""}">Prazo: ${p.prazo?esc(p.prazo.split("-").reverse().join("/")):"—"}${atr?" (atrasado)":""}</p>
      <p>Resp.: ${esc(p.responsavel||"—")} · Instalador: ${esc(p.instalador||"—")}</p>
      ${p.obs?`<p><i>${esc(p.obs)}</i></p>`:""}
      <div class="row">${prox?`<button data-a="next" data-id="${p.id}">Avançar → ${esc(prox)}</button>`:""}<button class="l" data-a="edit" data-id="${p.id}">Editar</button></div></div>`}).join("")
    :`<p style="text-align:center;color:var(--m)">Nenhum pedido nesta lista.</p>`;
  $("list").querySelectorAll("button").forEach(b=>b.onclick=()=>b.dataset.a==="next"?avancar(b.dataset.id):abrir(b.dataset.id));
}
async function avancar(id){
  const p=pedidos.find(x=>x.id===id),prox=STAGES[STAGES.indexOf(p.status)+1];if(!prox)return;
  await upd(id,{status:prox,historico:arrayUnion({etapa:prox,em:Date.now(),por:user.email})});
}
const upd=(id,d)=>updateDoc(doc(db,"pedidos",id),{...d,atualizadoEm:serverTimestamp(),atualizadoPor:user.email}).catch(e=>alert("Erro ao salvar: "+e.code));

function abrir(id){
  editId=id||null;const p=id?pedidos.find(x=>x.id===id):{};
  $("dt").textContent=id?"Editar "+p.numero:"Novo pedido";
  $("f-cli").value=p.cliente||"";$("f-obra").value=p.obra||"";$("f-mat").value=p.material||"";$("f-sq").value=p.sqft||"";
  $("f-pz").value=p.prazo||"";$("f-resp").value=p.responsavel||"";$("f-inst").value=p.instalador||"";
  $("f-st").value=p.status||STAGES[0];$("f-obs").value=p.obs||"";$("del").classList.toggle("hide",!id);$("dlg").showModal();
}
$("add").onclick=()=>abrir();$("cancel").onclick=()=>$("dlg").close();
$("frm").onsubmit=async e=>{
  const d={cliente:$("f-cli").value.trim(),obra:$("f-obra").value.trim(),material:$("f-mat").value.trim(),
    sqft:$("f-sq").value,prazo:$("f-pz").value,responsavel:$("f-resp").value.trim(),instalador:$("f-inst").value.trim(),
    status:$("f-st").value,obs:$("f-obs").value.trim()};
  if(editId){const antes=pedidos.find(x=>x.id===editId).status;
    if(antes!==d.status)d.historico=arrayUnion({etapa:d.status,em:Date.now(),por:user.email});await upd(editId,d)}
  else{try{await addDoc(collection(db,"pedidos"),{...d,numero:"WS-"+Date.now().toString(36).slice(-5).toUpperCase(),
    historico:[{etapa:d.status,em:Date.now(),por:user.email}],criadoEm:serverTimestamp(),criadoPor:user.email})}
    catch(err){alert("Erro ao salvar: "+err.code)}}
};
$("del").onclick=async()=>{if(editId&&confirm("Excluir este pedido de vez?")){await deleteDoc(doc(db,"pedidos",editId));$("dlg").close()}};
</script>
</body>
</html>
